[package]
name = "atlassian-cli"
version = "0.2.4"
edition = "2021"
description = "Atlassian 私有部署统一 AI CLI (Jira + Confluence + Bitbucket)"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
reqwest-middleware = { version = "0.3", features = ["json"] }
reqwest-retry = "0.6"
urlencoding = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
dirs-next = "2.0"
rpassword = "7.3"

[profile.release]
strip = true
lto = true
