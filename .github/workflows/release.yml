name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.4.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive_name: atlassian-cli-aarch64-apple-darwin.tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_name: atlassian-cli-x86_64-unknown-linux-gnu.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Compress binary
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.archive_name }} atlassian-cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p dist
          find artifacts -type f -name "*.tar.gz" -exec cp {} dist/ \;
          cd dist
          sha256sum *.tar.gz > checksums.txt
          ls -la

      - name: Extract Release Notes from CHANGELOG.md
        id: changelog
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "Extracting release notes for tag ${TAG_NAME}..."
          python3 - << 'EOF'
          import sys, os, re
          tag = os.environ.get("TAG_NAME", "")
          ver = tag.lstrip("v")
          try:
              with open("CHANGELOG.md") as f:
                  content = f.read()
              pattern = rf"## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
              match = re.search(pattern, content, re.DOTALL)
              notes = match.group(1).strip() if match else ""
              if not notes:
                  notes = "See [CHANGELOG.md](https://github.com/infinitezerone/atlassian-cli/blob/main/CHANGELOG.md) for release notes."
              with open("release_notes.md", "w") as out:
                  out.write(notes + "\n")
          except Exception:
              with open("release_notes.md", "w") as out:
                  out.write("See [CHANGELOG.md](https://github.com/infinitezerone/atlassian-cli/blob/main/CHANGELOG.md) for release notes.\n")
          EOF
          cat release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew-tap:
    name: Update Homebrew Tap Formula
    needs: [build-release, create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Check TAP Token
        id: check_token
        run: |
          if [ -n "${{ secrets.TAP_GITHUB_TOKEN }}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "TAP_GITHUB_TOKEN not configured, skipping Homebrew Tap update."
          fi

      - name: Download All Release Assets
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/download-artifact@v4
        with:
          path: tap-artifacts

      - name: Checkout Homebrew Tap
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/checkout@v4
        with:
          repository: infinitezerone/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Update Formula with SHA256
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          MAC_TAR=$(find tap-artifacts -type f -name "*darwin*.tar.gz" | head -n 1)
          LINUX_TAR=$(find tap-artifacts -type f -name "*linux*.tar.gz" | head -n 1)
          MAC_SHA=$(sha256sum "$MAC_TAR" | awk '{print $1}')
          LINUX_SHA=$(sha256sum "$LINUX_TAR" | awk '{print $1}')

          echo "Updating Homebrew Formula: Version=${VERSION}"
          echo "macOS SHA256=${MAC_SHA}"
          echo "Linux SHA256=${LINUX_SHA}"

          cd homebrew-tap
          FORMULA="Formula/atlassian-cli.rb"
          cat > "$FORMULA" << EOF
          class AtlassianCli < Formula
            desc "Unified AI-native CLI for Atlassian (Jira + Confluence + Bitbucket)"
            homepage "https://github.com/infinitezerone/atlassian-cli"
            version "${VERSION}"
            license "MIT"

            on_macos do
              url "https://github.com/infinitezerone/atlassian-cli/releases/download/v#{version}/atlassian-cli-aarch64-apple-darwin.tar.gz"
              sha256 "${MAC_SHA}"
            end

            on_linux do
              url "https://github.com/infinitezerone/atlassian-cli/releases/download/v#{version}/atlassian-cli-x86_64-unknown-linux-gnu.tar.gz"
              sha256 "${LINUX_SHA}"
            end

            def install
              bin.install "atlassian-cli"
            end

            def caveats
              <<~EOS
                🎉 安装/升级完成！
                若要在当前终端窗口立即使用，请运行:
                  exec \$SHELL   (或直接打开一个新的终端窗口)

                👉 运行以下命令完成接入配置:
                  atlassian-cli login

                🤖 运行以下命令一键部署官方 AI Agent Skill:
                  atlassian-cli skill install
              EOS
            end

            test do
              assert_match "atlassian-cli", shell_output("#{bin}/atlassian-cli --help")
            end
          end
          EOF
          sed -i 's/^          //' "$FORMULA"

          git config user.name "Infinite Zerone"
          git config user.email "infinitezerone@users.noreply.github.com"
          git add "$FORMULA"
          git commit -m "chore: auto-update formula for ${TAG_NAME}" || exit 0
          git pull --rebase origin main
          git push
