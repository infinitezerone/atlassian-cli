name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive_name: atlassian-cli-aarch64-apple-darwin.tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_name: atlassian-cli-x86_64-unknown-linux-gnu.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Compress binary
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.archive_name }} atlassian-cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p dist
          find artifacts -type f -name "*.tar.gz" -exec cp {} dist/ \;
          cd dist
          sha256sum *.tar.gz > checksums.txt
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew-tap:
    name: Update Homebrew Tap Formula
    needs: [build-release, create-release]
    runs-on: ubuntu-latest
    if: ${{ secrets.TAP_GITHUB_TOKEN != '' }}
    steps:
      - name: Download macOS Release Asset
        uses: actions/download-artifact@v4
        with:
          name: atlassian-cli-aarch64-apple-darwin.tar.gz

      - name: Checkout Homebrew Tap
        uses: actions/checkout@v4
        with:
          repository: infinitezerone/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Update Formula with SHA256
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          SHA256=$(sha256sum atlassian-cli-aarch64-apple-darwin.tar.gz | awk '{print $1}')
          echo "Updating Homebrew Formula: Version=${VERSION}, SHA256=${SHA256}"

          cd homebrew-tap
          FORMULA="Formula/atlassian-cli.rb"
          sed -i "s/version \".*\"/version \"${VERSION}\"/" "$FORMULA"
          sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" "$FORMULA"

          git config user.name "Infinite Zerone"
          git config user.email "infinitezerone@users.noreply.github.com"
          git add "$FORMULA"
          git commit -m "chore: auto-update formula for ${TAG_NAME}" || exit 0
          git pull --rebase origin main
          git push
